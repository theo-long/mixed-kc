[project]
name = "mixed-kc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dd>=0.6.0",
    "imageio>=2.37.3",
    "ipykernel>=7.1.0",
    "ipympl>=0.10.0",
    "ipython>=9.9.0",
    "matplotlib>=3.10.8",
    "multiset>=3.2.0",
    "networkx>=3.6.1",
    "pillow>=12.1.0",
    "pydantic-settings>=2.12.0",
    "pydot>=4.0.1",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv] 
package = true
